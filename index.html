<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f3ed">
<title>Higher or Lower — Number Guessing Game</title>
<style>
  :root{color-scheme:light;--ink:#20231f;--muted:#73786f;--paper:#f6f3ed;--card:#fffefa;--green:#365c49;--green-dark:#294738;--line:#e8e5dc;--orange:#e8a45d;--red:#b35745;--shadow:0 20px 60px #29362b12}
  *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:32px 18px}
  .shell{width:min(100%,500px)}.topline{display:flex;justify-content:space-between;align-items:center;margin:0 4px 18px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.brand{display:flex;align-items:center;gap:9px}.mark{display:grid;place-items:center;width:27px;height:27px;border-radius:9px;background:var(--green);color:white;font-size:14px;letter-spacing:0}
  .card{position:relative;overflow:hidden;background:var(--card);border:1px solid #ebe8df;border-radius:26px;padding:38px 38px 30px;box-shadow:var(--shadow)}.card:before{position:absolute;content:"";width:220px;height:220px;border-radius:50%;background:#f2eadb55;right:-110px;top:-130px;pointer-events:none}
  .eyebrow{display:flex;align-items:center;gap:8px;color:var(--green);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.eyebrow i{width:7px;height:7px;border-radius:50%;background:#74a581;box-shadow:0 0 0 4px #74a58122}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;letter-spacing:-.045em;font-size:clamp(42px,9vw,58px);line-height:.98;margin:17px 0 14px}.hints{color:var(--muted);font-size:15px;line-height:1.6;margin:0;max-width:340px}
  .range{display:flex;justify-content:space-between;align-items:center;background:#f7f5ef;border:1px solid #efede5;border-radius:14px;padding:13px 16px;margin:26px 0 24px}.range span:first-child,.range span:last-child{font-variant-numeric:tabular-nums;font-weight:750;font-size:14px}.range-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.13em;font-weight:700}.field-label{display:block;font-size:13px;font-weight:750;margin:0 0 9px}.input-row{display:flex;gap:10px}.input-wrap{position:relative;flex:1}.input-wrap input{width:100%;height:54px;border:1px solid #deddd5;border-radius:12px;padding:0 16px;font:inherit;font-size:17px;font-weight:650;color:var(--ink);background:#fff;outline:none;transition:border .18s,box-shadow .18s}.input-wrap input::placeholder{color:#b3b5ad;font-weight:450}.input-wrap input:focus{border-color:var(--green);box-shadow:0 0 0 4px #365c4918}.input-wrap input:disabled{background:#f7f5ef;color:var(--muted)}button{font:inherit;cursor:pointer}.submit{height:54px;padding:0 20px;border:0;border-radius:12px;background:var(--green);color:white;font-size:14px;font-weight:750;transition:background .15s,transform .15s}.submit:hover{background:var(--green-dark);transform:translateY(-1px)}.submit:active{transform:translateY(0)}.submit:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .status{min-height:48px;margin:17px 0 0;padding:12px 14px;border-radius:12px;background:#f7f5ef;color:var(--muted);font-size:13px;line-height:1.45;display:flex;align-items:center;gap:10px}.status .icon{font-size:17px;line-height:1}.status.good{background:#edf5ee;color:#315a40}.status.high{background:#fcf0e4;color:#9a602d}.status.low{background:#edf1f7;color:#4c6380}.status.error{background:#faece9;color:var(--red)}.status.win{background:#e8f3e9;color:#315a40;font-weight:700}
  .footer{border-top:1px solid var(--line);margin-top:23px;padding-top:18px;display:flex;align-items:center;justify-content:space-between}.attempts{font-size:13px;color:var(--muted)}.attempts strong{color:var(--ink);font-variant-numeric:tabular-nums}.reset{display:flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--green);font-size:13px;font-weight:750;padding:8px 0}.reset:hover{color:var(--green-dark)}.reset svg{width:15px;height:15px}
  .history{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px;min-height:8px}.guess-chip{height:26px;min-width:34px;padding:0 9px;display:grid;place-items:center;border-radius:99px;background:#f1efe9;color:#666b63;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;animation:pop .2s ease-out}.guess-chip.high{background:#fcf0e4;color:#9a602d}.guess-chip.low{background:#edf1f7;color:#4c6380}.guess-chip.won{background:#e8f3e9;color:#315a40}@keyframes pop{from{transform:scale(.7);opacity:.4}to{transform:scale(1);opacity:1}}
  .note{text-align:center;color:#9a9b94;font-size:11px;margin:17px 0 0;letter-spacing:.025em}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  @media(max-width:480px){.card{padding:29px 22px 23px;border-radius:22px}.topline{margin-bottom:13px}.card:before{width:160px;height:160px;right:-90px;top:-110px}.submit{padding:0 15px}}
  @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="shell">
  <div class="topline"><div class="brand"><span class="mark">?</span><span>Little brain games</span></div><span>01 / 01</span></div>
  <section class="card" aria-labelledby="title">
    <div class="eyebrow"><i></i> A guessing game</div>
    <h1 id="title">Higher<br>or lower?</h1>
    <p class="hints">I’ve picked a secret number. You have three guesses. I’ll give you a hint after each one.</p>
    <div class="range" aria-label="Number range from 1 to 100"><span>01</span><span class="range-label">Pick a number</span><span>100</span></div>
    <form id="guess-form" novalidate>
      <label class="field-label" for="guess">Your guess</label>
      <div class="input-row"><div class="input-wrap"><input id="guess" name="guess" type="number" inputmode="numeric" min="1" max="100" placeholder="Type a number…" autocomplete="off" required aria-describedby="status"></div><button class="submit" id="submit" type="submit">Guess <span aria-hidden="true">→</span></button></div>
    </form>
    <div class="status" id="status" role="status" aria-live="polite"><span class="icon" aria-hidden="true">✳</span><span>Make your first guess to get started.</span></div>
    <div class="history" id="history" aria-label="Previous guesses"></div>
    <div class="footer"><div class="attempts">Guesses <strong id="count">0</strong></div><button class="reset" id="reset" type="button"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3.2 9.8a6.8 6.8 0 1 0 2-4.8L3 7.2M3 3.6v3.8h3.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Start over</button></div>
  </section>
  <p class="note">A fresh number is waiting every time you start over.</p>
</main>
<script>
(() => {
  const form = document.querySelector('#guess-form');
  const input = document.querySelector('#guess');
  const status = document.querySelector('#status');
  const count = document.querySelector('#count');
  const history = document.querySelector('#history');
  const submit = document.querySelector('#submit');
  let secret, guesses, finished;
  const maxGuesses = 3;

  function newGame() {
    secret = Math.floor(Math.random() * 100) + 1;
    guesses = [];
    finished = false;
    count.textContent = '0';
    history.replaceChildren();
    input.value = '';
    input.disabled = false;
    submit.disabled = false;
    status.className = 'status';
    status.innerHTML = '<span class="icon" aria-hidden="true">✳</span><span>Make your first guess to get started.</span>';
    input.focus();
  }

  function showMessage(kind, icon, message) {
    status.className = `status ${kind}`;
    status.innerHTML = `<span class="icon" aria-hidden="true">${icon}</span><span>${message}</span>`;
  }

  form.addEventListener('submit', event => {
    event.preventDefault();
    if (finished) return;
    const raw = input.value.trim();
    const value = Number(raw);
    if (!raw || !Number.isInteger(value) || value < 1 || value > 100) {
      showMessage('error', '!', 'Enter a whole number between 1 and 100.');
      input.focus();
      return;
    }
    if (guesses.includes(value)) {
      showMessage('error', '↻', `You already tried ${value}. Take another guess.`);
      input.select();
      return;
    }
    guesses.push(value);
    count.textContent = String(guesses.length);
    const chip = document.createElement('span');
    chip.className = 'guess-chip';
    chip.textContent = String(value);
    chip.setAttribute('aria-label', `Guess ${value}`);
    history.append(chip);
    if (value === secret) {
      finished = true;
      chip.classList.add('won');
      showMessage('win', '✓', `You got it! ${secret} was the number — nice guessing.`);
      input.disabled = true;
      submit.disabled = true;
    } else {
      const tooHigh = value > secret;
      chip.classList.add(tooHigh ? 'high' : 'low');
      if (guesses.length >= maxGuesses) {
        finished = true;
        showMessage('error', '↻', `No more guesses. The number was ${secret}. Try again!`);
        input.disabled = true;
        submit.disabled = true;
      } else if (tooHigh) {
        showMessage('high', '↘', 'Too high. Try again with a smaller number.');
      } else {
        showMessage('low', '↗', 'Too low. Try again with a bigger number.');
      }
    }
    if (!finished) { input.value = ''; input.focus(); }
  });
  document.querySelector('#reset').addEventListener('click', newGame);
  newGame();
})();
</script>
</body>
</html>
